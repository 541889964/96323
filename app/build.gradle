plugins { id 'com.android.application' }
android {
    namespace 'com.example.deepseekpow'
    compileSdk 33
    defaultConfig { applicationId "com.example.deepseekpow"; minSdk 27; targetSdk 33; versionCode 3; versionName "2.0" }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
