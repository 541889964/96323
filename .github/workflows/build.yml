name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.1' }
      - name: Build
        run: |
          gradle wrapper --gradle-version 7.6.1
          ./gradlew assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeepSeekHook.apk
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Release v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/DeepSeekHook.apk
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
